# The tagger trained on DNC (run 125335: 117 messages, 40 epochs), continued
# on those 117 and the 85 Enron messages together. As warm-gliner.toml.
#
#   cd mixed-train && uv run strata-experiment run warm-tagger.toml

project = "."
name = "mixed-warm-tagger"

[[stage]]
use = "dataset"
name = "mixed-train"
val_ratio = 0.2
holdout_ratio = 0.0

[[stage]]
use = "materialise"

[[stage]]
use = "split"

[[stage]]
use = "train"
parent = "20261014T125335743332-ubuntu-pc"

[[stage]]
use = "evaluate"
on = "val"
tasks = [
    { use = "entities" },
    { use = "mask" },
]

[grid]
"train.params.num_epochs" = [10, 20]
"train.params.seed" = [1, 2, 3]
