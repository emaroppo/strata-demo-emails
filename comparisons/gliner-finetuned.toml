# GLiNER fine-tuned on the 117 training messages of emails v7, scored on
# its 29 validation messages. Dev numbers, not gold. Three seeds per
# checkpoint, so the report shows the spread. The training settings are a
# modest default, not tuned.

project = "."
name = "gliner-finetuned"

[[stage]]
use = "dataset"
name = "emails"
version = 7
val_ratio = 0.2
holdout_ratio = 0.0

[[stage]]
use = "materialise"

[[stage]]
use = "split"

[[stage]]
use = "train"
model = "gliner-span"
fresh = true
params = { num_epochs = 10, lr = 1e-5, others_lr = 5e-5, batch_size = 8 }

[[stage]]
use = "evaluate"
on = "val"
tasks = [
    { use = "entities" },
    { use = "mask" },
]

[grid]
"train.params.checkpoint" = [
    "knowledgator/gliner-pii-base-v1.0",
    "urchade/gliner_multi_pii-v1",
    "urchade/gliner_medium-v2.1",
]
"train.params.seed" = [1, 2, 3]
