[project]
name = "strata-prepare-email"
version = "0.1.0"
description = "Mail into a catalog: the email sample type, and converters from .eml and message JSON"
readme = "README.md"
requires-python = ">=3.13"
# Only the preparer framework and the types, and the standard library's own
# mail parser. A plugin that made this expensive to install would be a poor
# advertisement for preparers being plugins at all.
dependencies = [
    "strata-prepare>=0.1,<0.2",
    "strata-contracts>=0.1,<0.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "strata-prepare[test]>=0.1,<0.2"]

# What this adds: one sample type, and two ways into it. The
# candidate spans a converted corpus carries land when it is ingested,
# like any prepared corpus's labels; nothing here writes to a catalog.
[project.entry-points."strata.sample_types"]
email = "strata.prepare_email.types:Email"

[project.entry-points."strata.preparers"]
eml = "strata.prepare_email.eml:EmlPreparer"
email-json = "strata.prepare_email.messages:MessagesPreparer"

# The same conversions as preparation stages, which a catalog runs over raw
# files it holds (strata's docs/adr/0046), and phishnet's cleaning.
[project.entry-points."strata.prepare_stages"]
parse-rfc822 = "strata.prepare_email.stages:ParseRfc822"
parse-message-json = "strata.prepare_email.stages:ParseMessageJson"
clean-debris = "strata.prepare_email.stages:CleanDebris"


# What developing this package alone needs beyond its extras. Inside the
# strata workspace the root's group is used instead.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# The same set as every strata package: pinned, widened once, on purpose.
select = ["E", "F", "I", "B", "SIM", "DTZ", "UP", "C4", "RUF"]

[tool.ruff.lint.isort]
# The namespace is one project however many repositories hold it, so a
# sibling package sorts with this one and not with the third parties.
known-first-party = ["strata"]

[tool.pyright]
include = ["strata"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# PEP 420 namespace: no strata/__init__.py in any package, or they stop merging
packages = ["strata"]
