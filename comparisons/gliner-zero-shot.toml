# GLiNER with no training on the interim dev set (emails v7 val, 29
# messages). Dev numbers, not gold. Zero-shot is deterministic, so one
# trial per checkpoint and no seeds. It doesn't know the labelling guide's
# conventions (titles inside names, handles as URLs), so partial F1 is the
# fairer of its two numbers.

project = "."
name = "gliner-zero-shot"

[[stage]]
use = "dataset"
name = "emails"
version = 7
val_ratio = 0.2
holdout_ratio = 0.0

[[stage]]
use = "materialise"

[[stage]]
use = "split"

[[stage]]
use = "train"
model = "gliner-span"
fresh = true
params = { num_epochs = 0 }

[[stage]]
use = "evaluate"
on = "val"
tasks = [
    { use = "entities" },
    { use = "mask" },
]

[grid]
"train.params.checkpoint" = [
    "knowledgator/gliner-pii-base-v1.0",
    "urchade/gliner_multi_pii-v1",
    "urchade/gliner_medium-v2.1",
]
