# GLiNER trained on DNC (run 131623: 117 messages, 30 epochs), continued on
# the 85 Enron messages a person labelled. The gold set is in no collection
# this project draws from; it is scored apart (notes/score_enron.py).
#
#   cd enron-train && uv run strata-experiment run enron85-gliner.toml

project = "."
name = "enron85-warm-gliner"

[[stage]]
use = "dataset"
name = "enron-train"
val_ratio = 0.2
holdout_ratio = 0.0

[[stage]]
use = "materialise"

[[stage]]
use = "split"

[[stage]]
use = "train"
model = "gliner-span"
parent = "20261014T131623020666-ubuntu-pc"
params = { checkpoint = "knowledgator/gliner-pii-base-v1.0", whole_urls = true, lr = 3e-5, others_lr = 5e-5, batch_size = 8 }

[[stage]]
use = "evaluate"
on = "val"
tasks = [
    { use = "entities" },
    { use = "mask" },
]

[grid]
"train.params.num_epochs" = [10, 20]
"train.params.seed" = [1, 2, 3]
