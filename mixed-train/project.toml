name = "mixed-train"

# The DNC messages the DNC runs trained on, beside the Enron messages a
# person labelled for training: no DNC validation messages, no import labels,
# none of the Enron gold set. Its runs continue the DNC ones, so runs/ is the
# parent project's store.

[label_set]
label_type = "span"
classes = ["PER", "ORG", "LOC", "DATE", "EMAIL", "PHONE", "URL", "ATTACHMENT"]

[data]
# Under the parent's data/, which is ignored: somebody's mail.
source_root = "../data/enron/source"
root = "../data/enron/raw"
type = "email"
# Records of messages with the entity extraction they arrived with
preparer = "email-json"

[catalog]
name = "emails"
label_set = "emails"
dataset = "mixed-train"
collections = ["emails/mixed-train"]

[model]
ref = "text-span"

[model.params]
num_epochs = 4
batch_size = 8
lr = 5e-5
window = 512

[model.fresh_params]
num_epochs = 40
