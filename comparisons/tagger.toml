# The BIO tagger (text-span, DistilBERT) on the interim dev set: the 29
# validation messages of emails v7. Dev numbers, not gold: see
# docs/roadmap.md, step 2. Run from the project directory:
#
#   uv run strata-experiment run comparisons/tagger.toml
#   uv run strata-experiment report comparisons/*.toml

project = "."
name = "tagger"

[[stage]]
use = "dataset"
name = "emails"
# Pinned, so every comparison scores the same 29 messages whatever has
# been labelled since.
version = 7
val_ratio = 0.2
holdout_ratio = 0.0

[[stage]]
use = "materialise"

[[stage]]
# No seed: the version's own sides are read, not redrawn.
use = "split"

[[stage]]
use = "train"
# The project's model and parameters, cold, on its fresh schedule.
fresh = true

[[stage]]
use = "evaluate"
on = "val"
tasks = [
    { use = "entities" },
    { use = "mask" },
]

[grid]
"train.params.seed" = [1, 2, 3]
