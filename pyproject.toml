# The emails demo: a strata project directory, and the environment it runs
# in. Not a package: nothing here is built or installed, so uv keeps only
# the environment (package = false).
[project]
name = "strata-demo-emails"
version = "0.1.0"
description = "Named entities in mail: a strata project whose corpus arrives as .eml, with the converter as its own plugin"
requires-python = ">=3.13"
dependencies = [
    # The labelling loop, and through it the catalog, modelling and the job.
    "strata-labeller",
    # This project's own plugin: the email sample type and the two preparers,
    # in prepare-email/ beside this file, registered through strata's entry
    # points like any plugin written outside strata.
    "strata-prepare-email",
    # Named here although the labeller brings them: uv applies a source only
    # to a direct dependency, and until these are on an index each needs
    # its source below.
    "strata-contracts",
    "strata-common",
    "strata-catalog",
    "strata-prepare",
    "strata-evaluation",
    "strata-modelling",
    "strata-project",
]

[project.optional-dependencies]
# The span tagger's framework. Left out of the base install so a host that
# only prepares and ingests carries no torch.
model = ["strata-modelling[text,gliner]"]
# Running an experiment file over this project.
experiment = ["strata-experiment"]

[tool.uv]
package = false

# Until the strata packages are on an index they come from their
# repositories on GitHub, at main; the plugin comes from beside this file.
[tool.uv.sources]
strata-prepare-email = { path = "prepare-email", editable = true }
strata-contracts = { git = "https://github.com/emaroppo/strata-contracts.git", branch = "main" }
strata-common = { git = "https://github.com/emaroppo/strata-common.git", branch = "main" }
strata-catalog = { git = "https://github.com/emaroppo/strata-catalog.git", branch = "main" }
strata-prepare = { git = "https://github.com/emaroppo/strata-prepare.git", branch = "main" }
strata-evaluation = { git = "https://github.com/emaroppo/strata-evaluation.git", branch = "main" }
strata-modelling = { git = "https://github.com/emaroppo/strata-modelling.git", branch = "main" }
strata-project = { git = "https://github.com/emaroppo/strata-project.git", branch = "main" }
strata-labeller = { git = "https://github.com/emaroppo/strata-labeller.git", branch = "main" }
strata-experiment = { git = "https://github.com/emaroppo/strata-experiment.git", branch = "main" }

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["prepare-email/tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "DTZ", "UP", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["strata"]
