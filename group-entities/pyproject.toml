[project]
name = "group-entities"
version = "0.1.0"
description = "Which masked spans in a message are the same entity, numbered into [PER_1]-style placeholders"
requires-python = ">=3.13"
# httpx only for the llama.cpp chooser; grouping by rule needs nothing.
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "DTZ", "UP", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["group_entities"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["group_entities"]
